<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Payment Admin Detail</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" crossorigin="anonymous">
</head>
<body>
<div class="container my-2">
    <h3>Payment Admin Detail</h3>
    <table class="table table-striped table-responsive-md">
        <tbody>
        <tr>
            <th>Payment ID</th>
            <td th:text="${payment.id}"></td>
        </tr>
        <tr>
            <th>Method</th>
            <td th:text="${payment.method}"></td>
        </tr>
        <tr>
            <th>Status</th>
            <td th:text="${payment.status}"></td>
        </tr>
        </tbody>
    </table>

    <form th:action="@{/payment/admin/set-status/{paymentId}(paymentId=${payment.id})}" method="post">
        <button type="submit" class="btn btn-success mr-2" name="status" value="SUCCESS">SUCCESS</button>
        <button type="submit" class="btn btn-danger" name="status" value="REJECTED">REJECTED</button>
    </form>
</div>
</body>
</html>
