<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Pay Order</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" crossorigin="anonymous">
</head>
<body>
<div class="container">
    <h3>Pay Order</h3>
    <p th:text="'Order ID: ' + ${order.id}"></p>

    <form th:action="@{/order/pay/{orderId}(orderId=${order.id})}" method="post">
        <div class="form-group">
            <label for="methodInput">Method</label>
            <select class="form-control mb-4 col-4" id="methodInput" name="method">
                <option value="Voucher Code">Voucher Code</option>
                <option value="Bank Transfer">Bank Transfer</option>
            </select>
        </div>
        <div class="form-group">
            <label for="voucherCodeInput">Voucher Code</label>
            <input type="text" class="form-control mb-4 col-4" id="voucherCodeInput" name="voucherCode" placeholder="Enter voucher code">
        </div>
        <div class="form-group">
            <label for="bankNameInput">Bank Name</label>
            <input type="text" class="form-control mb-4 col-4" id="bankNameInput" name="bankName" placeholder="Enter bank name">
        </div>
        <div class="form-group">
            <label for="referenceCodeInput">Reference Code</label>
            <input type="text" class="form-control mb-4 col-4" id="referenceCodeInput" name="referenceCode" placeholder="Enter reference code">
        </div>
        <button type="submit" class="btn btn-primary">Pay</button>
    </form>
</div>
</body>
</html>
